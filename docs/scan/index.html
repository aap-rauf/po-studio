<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#173b31"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="scanner.css"><title>Phone scans · PO Studio</title></head>
<body><header><div class="bar"><button id="back" type="button" hidden aria-label="Back to scanned items"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><div><small>PO Studio</small><h1 id="store">Phone scans</h1></div></div></header>
<main><section id="listPage"><div class="heading"><h2>Scanned items</h2><span id="units"></span></div><div class="selection"><button id="selectMode" hidden>Select items</button><button id="selectAll" hidden>Select all</button><button id="deleteSelected" hidden>Delete selected</button></div><ul id="items"></ul><p id="empty">No items scanned yet. Tap + to add the first item.</p><button id="newItem" class="fab" type="button" aria-label="Add scanned item">+</button><button id="install" hidden>Install scanner</button><p id="installHelp" hidden>To install, tap Share → Add to Home Screen.</p></section>
<section id="formPage" hidden><h2 id="formTitle">Add item</h2><form id="scanForm">
<label for="barcode">Barcode <span>*</span></label><div class="field"><input id="barcode" required maxlength="128" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="cameraBtn" type="button" aria-label="Scan barcode with camera"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8V4h4m10 0h4v4M3 16v4h4m10 0h4v-4M7 8v8m3-8v8m4-8v8m3-8v8"/></svg></button></div>
<label for="qty">Quantity <span>*</span></label><div class="field"><input id="qty" type="text" inputmode="numeric" required pattern="[0-9]{1,6}" maxlength="6" value="1"><button id="minus" type="button" aria-label="Decrease quantity">−</button><button id="plus" type="button" aria-label="Increase quantity">+</button></div>
<button type="button" id="deleteItem" hidden>Delete item</button><footer><div><button id="cancel" type="button">Cancel</button><button id="add" type="submit">Save</button></div></footer></form></section>
<p id="status" role="status"></p><p id="pending" role="status"></p><button id="retry" hidden>Retry pending scans</button></main>
<dialog id="viewfinder" aria-label="Scan barcode"><div id="camera"></div><div class="aim"></div><div class="cameraTools"><button id="torch" hidden>Light</button><button id="flip" hidden>Switch camera</button><button id="closeCamera">Close</button></div></dialog>
<script src="vendor/html5-qrcode.min.js"></script><script src="common.js"></script><script src="phone.js"></script><script src="install.js"></script></body></html>
